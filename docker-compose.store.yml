name: maktaba-store

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    volumes: [store_postgres_data:/var/lib/postgresql/data]
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt: ["no-new-privileges:true"]

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
      args: { BUILD_VERSION: "${BUILD_VERSION:?BUILD_VERSION is required}" }
    restart: "no"
    env_file: .env.store
    command: ["node", "--enable-source-maps", "./artifacts/api-server/dist/migrate.mjs"]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [database]
    security_opt: ["no-new-privileges:true"]

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      args: { BUILD_VERSION: "${BUILD_VERSION:?BUILD_VERSION is required}" }
    restart: unless-stopped
    env_file: .env.store
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    volumes: [store_uploads:/app/uploads]
    networks: [edge, database]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5001/api/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  storefront:
    build:
      context: .
      dockerfile: Dockerfile.storefront
    restart: unless-stopped
    networks: [edge]
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  gateway:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:${STORE_GATEWAY_PORT:-19080}:8080"]
    volumes: ["./deploy/Caddyfile.store:/etc/caddy/Caddyfile:ro,Z"]
    depends_on:
      api: { condition: service_healthy }
      storefront: { condition: service_healthy }
    networks: [edge]
    security_opt: ["no-new-privileges:true"]

volumes:
  store_postgres_data:
  store_uploads:

networks:
  edge:
  database:
    internal: true
